name: cockado_enrollapp
description: "COC-CHECKIN — offline-first attendance and registration app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Local database (SQLCipher encrypted SQLite)
  drift: ^2.20.3
  sqlcipher_flutter_libs: ^0.5.4
  path_provider: ^2.1.4
  path: ^1.9.0

  # Secure storage (DB key + JWT)
  flutter_secure_storage: ^9.2.2

  # Camera + scanning
  camera: ^0.11.0+2
  mobile_scanner: ^5.2.3

  # Face detection + ML
  google_mlkit_face_detection: ^0.11.0

  # TFLite for face recognition (MobileFaceNet)
  tflite_flutter: ^0.12.1

  # HTTP
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # Network status
  connectivity_plus: ^6.0.5

  # Background tasks
  workmanager: ^0.9.0

  # Audio + haptics
  audioplayers: ^6.1.0
  vibration: ^2.0.0

  # App info
  package_info_plus: ^8.0.2

  # Preferences
  shared_preferences: ^2.3.2

  # Utils
  uuid: ^4.4.2
  intl: ^0.19.0
  equatable: ^2.0.5
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.3
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/audio/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
